name: Portable verification
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Linux Qt headless prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 fonts-dejavu-core
      - run: uv sync --locked --group dev --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/nmr_companion/static/app.js
      - run: node --check src/nmr_companion/static/batch.js
      - run: node --test tests/frontend/*.test.cjs
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run nmr-companion desktop-check
      - run: uv build
